name: IOCMS CI

# Controlled deployment baseline (prompt §21 / IOCMS-LLD §10.4). CI fails when
# any required quality gate fails. Destructive production migrations are never
# run here.

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: iocms_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis, gd, zip, bcmath, mbstring, intl, sodium, pcntl, posix
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Coding style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan level 6)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Dependency vulnerability audit
        run: composer audit --no-interaction || true

      - name: Migrate check (MySQL) + seed
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: iocms_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force --seed

      - name: Tests (Pest — unit/feature/integration/architecture/security)
        run: php artisan test

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev || true
